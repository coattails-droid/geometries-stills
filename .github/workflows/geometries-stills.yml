name: Geometries stills

# Weekdays 12:35 UTC (8:35 AM EDT / 7:35 AM EST): find minted Touring / Seeded / Tidal / Luminous Geometries tokens that still
# show the placeholder image, render their stills from the on-chain artwork, and prepare a Safe batch + an issue.
on:
  schedule:
    - cron: '35 12 * * 1-5'
  workflow_dispatch:
    inputs:
      series:
        description: 'Which series to check'
        type: choice
        options: [all, touring, seeded, tidal, luminous]
        default: all
      force_ids:
        description: 'Testing: render these token ids instead of detecting missing ones (e.g. "1,2"). Leave empty for normal runs.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only upload a workflow artifact (no commit, no issue)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: geometries-stills
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.p.outputs.series }}
    steps:
      - id: p
        run: |
          s='${{ inputs.series }}'
          if [ -z "$s" ] || [ "$s" = all ]; then echo 'series=["touring","seeded","tidal","luminous"]' >> "$GITHUB_OUTPUT"
          else echo "series=[\"$s\"]" >> "$GITHUB_OUTPUT"; fi

  stills:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.plan.outputs.series) }}
    name: ${{ matrix.series }}
    env:
      SERIES: ${{ matrix.series }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      FORCE_IDS: ${{ inputs.force_ids }}
      GH_TOKEN: ${{ github.token }}
      ASSIGNEE: coattails-droid
      CHROME_PATH: /usr/bin/google-chrome
      # Software rendering. Note: --use-angle=swiftshader changes 2D-canvas pixels vs. the stills already on-chain, so it's not used.
      CHROME_FLAGS: --disable-gpu --disable-dev-shm-usage
      KUBO_VERSION: v0.38.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Chrome (runner's Google Chrome; installs Chrome for Testing if the image ever drops it)
        run: |
          if ! [ -x "$CHROME_PATH" ]; then
            npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tee "$RUNNER_TEMP/chrome.txt"
            echo "CHROME_PATH=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -1)" >> "$GITHUB_ENV"
          fi

      - name: Install kubo (ipfs) ${{ env.KUBO_VERSION }}
        run: |
          f="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"; cd "$RUNNER_TEMP"
          for base in "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}" "https://dist.ipfs.tech/kubo/${KUBO_VERSION}"; do
            curl -fsSL --retry 3 --connect-timeout 20 -o "$f" "$base/$f" && curl -fsSL --retry 3 --connect-timeout 20 -o "$f.sha512" "$base/$f.sha512" && break
          done
          sha512sum -c "$f.sha512"; tar -xzf "$f"
          echo "$RUNNER_TEMP/kubo" >> "$GITHUB_PATH"
          echo "IPFS_PATH=$RUNNER_TEMP/ipfs-repo" >> "$GITHUB_ENV"
          IPFS_PATH="$RUNNER_TEMP/ipfs-repo" "$RUNNER_TEMP/kubo/ipfs" init --empty-repo >/dev/null
          "$RUNNER_TEMP/kubo/ipfs" version; "$CHROME_PATH" --version; cast --version | head -1

      - name: Find tokens without a still
        id: find
        run: ./scripts/find_missing.sh "$SERIES"

      - name: Check open issues (dedupe)
        id: check
        if: env.DRY_RUN != 'true'
        run: ./scripts/issues.sh check "$SERIES" "${{ steps.find.outputs.ids }}"

      - name: Render stills, zip, CID, Safe batch, simulate, contact sheet
        id: build
        if: steps.find.outputs.count != '0' && (env.DRY_RUN == 'true' || steps.check.outputs.action == 'build')
        env:
          BLOCK: ${{ steps.find.outputs.block }}
        run: ./scripts/build.sh "$SERIES" "${{ steps.find.outputs.ids }}"

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.series }}-${{ steps.build.outputs.date }}-${{ steps.build.outputs.first }}-${{ steps.build.outputs.last }}${{ env.DRY_RUN == 'true' && '-dryrun' || '' }}
          path: ${{ steps.build.outputs.dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit batch to the repo
        id: commit
        if: steps.build.outcome == 'success' && env.DRY_RUN != 'true'
        run: |
          DEST="batches/$SERIES/$(basename "${{ steps.build.outputs.dir }}")"
          rm -rf "$DEST"; mkdir -p "$DEST"; cp -r "${{ steps.build.outputs.dir }}"/. "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "$SERIES stills $(basename "$DEST") (CID ${{ steps.build.outputs.cid }})"
          for i in 1 2 3 4 5; do git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*5)); git pull --rebase origin ${{ github.ref_name }}; done
          git fetch origin ${{ github.ref_name }}; git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::push failed"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Open issue
        if: steps.commit.outcome == 'success'
        run: |
          ./scripts/issues.sh open "$SERIES" "${{ steps.find.outputs.ids }}" "${{ steps.build.outputs.cid }}" \
            "${{ steps.build.outputs.folder }}" "${{ steps.commit.outputs.dest }}" "${{ steps.commit.outputs.sha }}" \
            "${{ steps.build.outputs.zip }}" "${{ steps.build.outputs.batch }}" "${{ steps.find.outputs.block }}" "${{ steps.find.outputs.total_supply }}"

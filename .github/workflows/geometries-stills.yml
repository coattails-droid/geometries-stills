name: Geometries stills

# Weekdays 12:35 UTC (8:35 AM EDT / 7:35 AM EST): find minted Touring / Seeded / Tidal / Luminous / Stellar Geometries tokens that still
# show the placeholder image, render their stills from the on-chain artwork, and prepare a Safe batch + an issue.
# Condensed 2026-10-21 (Muse takeover): the old plan job + 5-way matrix became ONE job that sets up
# once (node/python/foundry/Chrome/kubo) and loops the series, so setup cost is paid once per run
# instead of five times. Per-series behavior is unchanged: find -> dedupe check -> build -> commit -> issue.
on:
  schedule:
    - cron: '35 12 * * 1-5'
  workflow_dispatch:
    inputs:
      series:
        description: 'Which series to check'
        type: choice
        options: [all, touring, seeded, tidal, luminous, stellar]
        default: all
      force_ids:
        description: 'Testing: render these token ids instead of detecting missing ones (e.g. "1,2"). Leave empty for normal runs.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only upload a workflow artifact (no commit, no issue)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: geometries-stills
  cancel-in-progress: false

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      FORCE_IDS: ${{ inputs.force_ids }}
      GH_TOKEN: ${{ github.token }}
      ASSIGNEE: coattails-droid
      CHROME_PATH: /usr/bin/google-chrome
      # Software rendering. Note: --use-angle=swiftshader changes 2D-canvas pixels vs. the stills already on-chain, so it's not used.
      CHROME_FLAGS: --disable-gpu --disable-dev-shm-usage
      KUBO_VERSION: v0.38.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Chrome (runner's Google Chrome; installs Chrome for Testing if the image ever drops it)
        run: |
          if ! [ -x "$CHROME_PATH" ]; then
            npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tee "$RUNNER_TEMP/chrome.txt"
            echo "CHROME_PATH=$(awk '{print $2}' "$RUNNER_TEMP/chrome.txt" | tail -1)" >> "$GITHUB_ENV"
          fi

      - name: Install kubo (ipfs) ${{ env.KUBO_VERSION }}
        run: |
          f="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"; cd "$RUNNER_TEMP"
          for base in "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}" "https://dist.ipfs.tech/kubo/${KUBO_VERSION}"; do
            curl -fsSL --retry 3 --connect-timeout 20 -o "$f" "$base/$f" && curl -fsSL --retry 3 --connect-timeout 20 -o "$f.sha512" "$base/$f.sha512" && break
          done
          sha512sum -c "$f.sha512"; tar -xzf "$f"
          echo "$RUNNER_TEMP/kubo" >> "$GITHUB_PATH"
          echo "IPFS_PATH=$RUNNER_TEMP/ipfs-repo" >> "$GITHUB_ENV"
          IPFS_PATH="$RUNNER_TEMP/ipfs-repo" "$RUNNER_TEMP/kubo/ipfs" init --empty-repo >/dev/null
          "$RUNNER_TEMP/kubo/ipfs" version; "$CHROME_PATH" --version; cast --version | head -1

      - name: Find, build, commit and open issues (per series)
        id: loop
        run: |
          STEP_OUT="$GITHUB_OUTPUT"
          case '${{ inputs.series }}' in
            ''|all) SERIES_LIST="touring seeded tidal luminous stellar" ;;
            *) SERIES_LIST='${{ inputs.series }}' ;;
          esac
          echo "Series this run: $SERIES_LIST"
          ART="$RUNNER_TEMP/artifacts"; mkdir -p "$ART"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FAILED=""; BUILT=0
          get_out() { grep "^$2=" "$1" 2>/dev/null | tail -1 | cut -d= -f2- || true; }
          for S in $SERIES_LIST; do
            echo "::group::$S"
            export SERIES="$S"
            OUT_F="$RUNNER_TEMP/ghout-$S.txt"; : > "$OUT_F"; export GITHUB_OUTPUT="$OUT_F"
            if ! ./scripts/find_missing.sh "$S"; then
              echo "::error::$S: find_missing failed"; FAILED="$FAILED $S(find)"; echo "::endgroup::"; continue
            fi
            ids=$(get_out "$OUT_F" ids); count=$(get_out "$OUT_F" count)
            block=$(get_out "$OUT_F" block); supply=$(get_out "$OUT_F" total_supply)
            action=build
            if [ "$DRY_RUN" != "true" ]; then
              if ! ./scripts/issues.sh check "$S" "$ids"; then
                echo "::error::$S: issues check failed"; FAILED="$FAILED $S(check)"; echo "::endgroup::"; continue
              fi
              action=$(get_out "$OUT_F" action); action=${action:-build}
            fi
            if [ "${count:-0}" != "0" ] && { [ "$DRY_RUN" = "true" ] || [ "$action" = "build" ]; }; then
              if ! BLOCK="$block" ./scripts/build.sh "$S" "$ids"; then
                echo "::error::$S: build failed"; FAILED="$FAILED $S(build)"; echo "::endgroup::"; continue
              fi
              bdate=$(get_out "$OUT_F" date); bfirst=$(get_out "$OUT_F" first); blast=$(get_out "$OUT_F" last)
              bdir=$(get_out "$OUT_F" dir); bcid=$(get_out "$OUT_F" cid); bfolder=$(get_out "$OUT_F" folder)
              bzip=$(get_out "$OUT_F" zip); bbatch=$(get_out "$OUT_F" batch)
              stage="$ART/$S-$bdate-$bfirst-$blast"; if [ "$DRY_RUN" = "true" ]; then stage="$stage-dryrun"; fi
              mkdir -p "$stage"; cp -r "$bdir"/. "$stage"/
              BUILT=$((BUILT+1))
              if [ "$DRY_RUN" != "true" ]; then
                DEST="batches/$S/$(basename "$bdir")"
                rm -rf "$DEST"; mkdir -p "$DEST"; cp -r "$bdir"/. "$DEST"/
                git add "$DEST"
                if git commit -m "$S stills $(basename "$DEST") (CID $bcid)"; then
                  ok=""
                  for i in 1 2 3 4 5; do
                    if git push origin HEAD:${{ github.ref_name }}; then ok=1; break; fi
                    sleep $((i*5)); git pull --rebase origin ${{ github.ref_name }} || true
                  done
                  git fetch origin ${{ github.ref_name }}
                  if [ -n "$ok" ] && git merge-base --is-ancestor HEAD FETCH_HEAD; then
                    sha=$(git rev-parse HEAD)
                    if ! ./scripts/issues.sh open "$S" "$ids" "$bcid" "$bfolder" "$DEST" "$sha" "$bzip" "$bbatch" "$block" "$supply"; then
                      echo "::error::$S: issue open failed"; FAILED="$FAILED $S(issue)"
                    fi
                  else
                    echo "::error::$S: push failed"; FAILED="$FAILED $S(push)"
                  fi
                else
                  echo "::error::$S: commit failed"; FAILED="$FAILED $S(commit)"
                fi
              fi
            fi
            echo "::endgroup::"
          done
          echo "built_count=$BUILT" >> "$STEP_OUT"
          if [ -n "$FAILED" ]; then echo "::error::Failed series:$FAILED"; exit 1; fi
          echo "Done. Built $BUILT batch(es)."

      - name: Upload artifacts
        if: ${{ !cancelled() && steps.loop.outputs.built_count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: geometries-stills-${{ github.run_id }}${{ inputs.dry_run == true && '-dryrun' || '' }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
          retention-days: 30
